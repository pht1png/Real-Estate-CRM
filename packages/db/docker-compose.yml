name: Real-Estate-CRM

services:
  postgres:
    image: postgres:18
    container_name: Real-Estate-CRM-postgres
    environment:
      POSTGRES_DB: Real-Estate-CRM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - Real-Estate-CRM_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  Real-Estate-CRM_postgres_data:
